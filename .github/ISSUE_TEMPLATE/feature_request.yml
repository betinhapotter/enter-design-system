name: ✨ Feature request
description: Sugerir uma melhoria ou novo componente
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema / motivação
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Solução proposta
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
